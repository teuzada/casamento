<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Confirmações | Rebeca e Mateus</title><link rel="stylesheet" href="style.css?v=rsvp-prazo-20261123"><style>.admin{max-width:1000px;margin:auto;padding:36px 18px 80px}.admin-panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}.admin input{padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;width:100%;max-width:400px}.admin-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}.admin-stat{background:var(--cream);border-radius:16px;padding:20px}.admin-stat strong{display:block;font-size:2rem;color:var(--brown)}.admin-list{display:grid;gap:12px;margin-top:20px}.admin-entry{border:1px solid var(--line);border-radius:14px;padding:16px}.admin-entry p{margin:5px 0}.admin-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.admin-actions button{box-shadow:none}.admin-msg{margin-top:14px}.admin-note{font-size:.88rem;color:var(--muted)}@media(max-width:600px){.admin{padding:22px 12px}.admin-panel{padding:20px 15px}}</style></head><body><main class="admin"><p class="eyebrow">ÁREA PRIVADA · REBECA &amp; MATEUS</p><h1 style="font-size:clamp(2rem,7vw,3.3rem)">Confirmações de presença</h1><p class="muted">Painel exclusivo para acompanhar os convidados e acompanhantes.</p><section class="admin-panel"><form id="admin-login"><label for="admin-password">Senha de acesso</label><p><input id="admin-password" type="password" autocomplete="off" required placeholder="Digite sua senha"></p><button class="button" type="submit">Entrar no painel</button></form><div id="admin-content" hidden><div class="admin-stats"><div class="admin-stat"><span>Confirmações</span><strong id="admin-count">0</strong></div><div class="admin-stat"><span>Total de pessoas</span><strong id="admin-people">0</strong></div></div><input id="admin-search" type="search" placeholder="Buscar convidado ou acompanhante..." aria-label="Buscar confirmações"><div class="admin-actions"><button class="button secondary" id="admin-refresh" type="button">Atualizar lista</button><button class="button secondary" id="admin-export" type="button">Exportar CSV</button><button class="button secondary" id="admin-exit" type="button">Sair</button></div><p class="admin-note">Os dados são consultados diretamente na planilha conectada.</p><div id="admin-list" class="admin-list"></div></div><p id="admin-msg" class="admin-msg" role="status"></p></section></main><script src="admin-confirmacoes.js?v=1"></script></body></html>
